# HLE unlock build — produces the vita3k_web runtime pair with the
# browser runtime's HLE allowlist extended to answer every NID the live
# boot digests of this site recorded as unserviced for STEINS;GATE
# (PCSE00644) and the Hollow Knight port (HKVT12222):
#   - the NGS voice definitions the games hand into RackGetRequiredMemory-
#     Size/RackInit (the INVALID_ARG wall that stopped the audio chain),
#   - the CRI kernel-timer family, GXM cube-texture inits and back-face
#     state setters, shader-patcher queries/teardown,
#   - app-parameter / save-data quota+slots / trophy game info,
#   - the save-data dialog continue/subclose pair, video decoder init,
#     decoder-management bodies, screen-shot enable/overlay stubs,
#   - LoadExec (cooperative app relaunch), camera setters, ctrl/motion
#     queries, apputil mounts + safe memory and the offline-network joins.
# Everything else (networking beyond the offline stack, message-pipe waits,
# DisplayQueueFinish, k* driver stubs, the port's ~30 SDK-Internal
# UNRECOGNISED NIDs) stays unsupported on purpose, as upstream documents.
#
# How to use (no local toolchain needed):
#   1. This workflow lives in the source fork (TheAlphaLeopard/vita3k-web-alt)
#      with the patches it applies beside it, in unlock-kit/:
#      vita3k-web-hle-unlock.patch and gxm-video-texels.patch.
#   2. Actions -> "HLE unlock build" -> Run workflow (takes a while; the
#      project's own CI allows up to 4 hours)
#   3. Download the artifact and copy its wasm64/ over wasm64/ in the Pages
#      repo (TheAlphaLeopard/vita3k-web) that serves this site.
#
# The build commands are the project's own (browser/pages/build.sh, the same
# one the upstream Pages workflow runs). The mt runtime stages its modules
# into the web64 dist, so one directory holds both pairs.

name: HLE unlock build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unlock-build
  cancel-in-progress: true

jobs:
  build:
    name: Build the unlocked runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # This fork itself (TheAlphaLeopard/vita3k-web-alt): it carries the
          # C++ sources AND the unlock-kit patches. No repository/ref override:
          # dispatch checks out this repository at its default branch tip.
          # Checking out the upstream (notwindstone/vita3k-web) fails — that
          # tree has no unlock-kit/, so git apply aborts with exit 128.
          submodules: recursive
          fetch-depth: 1

      - name: Apply the HLE unlock patch
        run: |
          set -euo pipefail
          git apply --check unlock-kit/vita3k-web-hle-unlock.patch
          git apply unlock-kit/vita3k-web-hle-unlock.patch
          git apply --check unlock-kit/gxm-video-texels.patch
          git apply unlock-kit/gxm-video-texels.patch
          grep -n "sceNgsVoiceDefGetSimpleVoice" browser/runtime_hle.cmake
          grep -n "sceKernelCreateTimer _sceKernelCreateTimer" browser/runtime_hle.cmake
          grep -n "modules/SceScreenShot/SceScreenShot.cpp" browser/runtime_hle.cmake
          grep -n "modules/SceSysmem/SceDebugLed.cpp" browser/runtime_hle.cmake
          grep -n "prev_rendered_epoch" browser/src/gxm_webgpu_bridge.cpp

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build both runtimes (project build.sh)
        run: nix develop --command env VITA3K_BUILD_JOBS="$(nproc)" browser/pages/build.sh build/unlock build/unlock-site

      - name: Collect wasm64
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -a build/unlock/web64/dist/wasm64 artifact/wasm64
          ls -la artifact/wasm64

      - uses: actions/upload-artifact@v4
        with:
          name: vita3k-web-hle-unlocked-wasm64
          path: artifact/wasm64
          if-no-files-found: error
